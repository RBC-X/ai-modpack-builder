name: Pages + screenshots

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Serialize main runs (the bot's own screenshot commit must not race the
  # run that created it) but cancel stale runs when a PR gains a new commit.
  group: pages-screenshots-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    # The bot's own screenshot commit must not re-trigger this job forever.
    # (head_commit is absent on pull_request events, so short-circuit there.)
    if: ${{ github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt offscreen system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r pyqt/requirements.txt

      - name: Seed a real build (live providers, instant validation)
        env:
          AMB_WORKSPACE: ${{ runner.temp }}/amb-workspace
        run: python pyqt/seed_ci_build.py

      - name: Run fast engine test suites (fail the job on any regression)
        env:
          AMB_WORKSPACE: ${{ runner.temp }}/amb-workspace
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          python pyqt/identity_snapshots_test.py
          python pyqt/health_concepts_test.py
          python pyqt/identity_ui_test.py
          python pyqt/smoke_test.py
          python pyqt/inprocess_test.py
          python pyqt/one_system_test.py
          python pyqt/stale_refresh_test.py
          python pyqt/launch_poll_race_test.py
          python pyqt/packdetail_load_race_test.py
          python pyqt/bugfix_regression_test.py
          python pyqt/security_quality_regression_test.py
          python pyqt/update_feed_edge_test.py
          python pyqt/wcag_cards_test.py
          python pyqt/addcontent_scoped_test.py
          python pyqt/addcontent_overflow_test.py
          python pyqt/responsive_layout_test.py

      - name: Regenerate screenshots (offscreen render, real engine data)
        env:
          AMB_WORKSPACE: ${{ runner.temp }}/amb-workspace
          QT_QPA_PLATFORM: offscreen
        run: python pyqt/screenshot.py

      # Write steps only on main pushes: a PR must not commit bot gallery
      # updates to its branch or trigger a Pages rebuild.
      - name: Refresh the committed gallery
        if: ${{ github.event_name == 'push' }}
        env:
          AMB_WORKSPACE: ${{ runner.temp }}/amb-workspace
        run: |
          set -e
          for f in \
            01-home 02-library 03-pack-overview 04-pack-content 05-pack-logs \
            06-pack-settings 07-discover 07b-discover-details 08-ai-builder \
            09-downloads 10-activity 11-settings 11b-provider-settings \
            11c-account-settings 11d-account-dialog 11e-appearance-settings \
            11f-minecraft-settings 11g-java-settings 11h-ai-settings \
            11i-cloud-settings 12-launch-overlay 13-update-toast \
            14-settings-updates; do
            cp "pyqt/screenshots/$f.png" "screenshots/$f.png"
          done
          git add screenshots
          if git diff --cached --quiet; then
            echo "gallery unchanged"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: regenerate launcher screenshots on main"
            git push
          fi

      - name: Rebuild the Pages site
        if: ${{ github.event_name == 'push' }}
        run: gh api repos/${{ github.repository }}/pages/builds -X POST >/dev/null 2>&1 || echo "Pages rebuild API unavailable; branch deploy rebuilds on the next push anyway"
